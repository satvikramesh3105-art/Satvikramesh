worker_processes auto;

events {
    worker_connections 512;
}

http {
    limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
    limit_req_zone $binary_remote_addr zone=per_ip_requests:10m rate=15r/s;
    limit_conn_status 429;
    limit_req_status 429;
    client_max_body_size 32k;
    server_tokens off;

    log_format sentinel_edge '$time_iso8601 client=$remote_addr status=$status '
                             'connections=$connection_requests req_limit=$limit_req_status '
                             'conn_limit=$limit_conn_status method=$request_method';
    access_log /dev/stdout sentinel_edge;
    error_log /dev/stderr warn;

    server {
        listen 8080;

        # Transport-edge guardrails: concurrent HTTP connections and request rate.
        # This is not SYN-flood protection or packet-level DDoS mitigation.
        limit_conn per_ip_connections 20;
        limit_req zone=per_ip_requests burst=30 nodelay;

        # Uploads are already encrypted and go straight to MinIO, never through Flask.
        location ^~ /sentinel-vault/ {
            client_max_body_size 100m;
            proxy_request_buffering off;
            proxy_pass http://minio:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://sentinel:5000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
